<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="carBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="carGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(6, 182, 212, 0.25)" />
      <stop offset="100%" stop-color="rgba(59, 130, 246, 0.15)" />
    </linearGradient>
  </defs>
  
  <!-- Backdrop -->
  <rect width="600" height="360" fill="url(#carBg)" />
  
  <!-- Modern UI Mockup Browser Frame -->
  <g transform="translate(40, 30)">
    <rect width="520" height="300" rx="16" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255,255,255,0.18)" stroke-width="2" />
    
    <!-- Browser Top Bar -->
    <rect width="520" height="36" rx="16" fill="rgba(255, 255, 255, 0.05)" />
    <circle cx="24" cy="18" r="5" fill="#EF4444" />
    <circle cx="40" cy="18" r="5" fill="#F59E0B" />
    <circle cx="56" cy="18" r="5" fill="#10B981" />
    
    <!-- Browser URL Bar -->
    <rect x="85" y="8" width="350" height="20" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" />
    <text x="260" y="22" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">carrental.demo &bull; Fleet Booking Platform</text>

    <!-- Inside Content -->
    <!-- Booking Search Bar Mockup -->
    <rect x="25" y="55" width="470" height="60" rx="10" fill="url(#carGlass)" stroke="rgba(6, 182, 212, 0.3)" />
    <text x="45" y="82" font-family="'Poppins', sans-serif" font-size="14" font-weight="bold" fill="#67E8F9">Reserve Premium Vehicles</text>
    <text x="45" y="100" font-family="'Inter', sans-serif" font-size="11" fill="#E2E8F0">Pick-up Location &bull; Date Range &bull; Instant Confirmation</text>
    <rect x="375" y="70" width="105" height="30" rx="8" fill="#06B6D4" />
    <text x="427" y="89" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#0F172A" text-anchor="middle">Search Fleet</text>

    <!-- 2 Featured Fleet Cards -->
    <!-- Car 1 -->
    <rect x="25" y="130" width="225" height="140" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" />
    <!-- Stylized Sedan Silhouette -->
    <path d="M 50 180 Q 75 160 110 160 L 150 160 Q 185 160 210 180 Z" fill="rgba(6, 182, 212, 0.3)" />
    <circle cx="75" cy="190" r="12" fill="#38BDF8" opacity="0.8" />
    <circle cx="185" cy="190" r="12" fill="#38BDF8" opacity="0.8" />
    <text x="40" y="225" font-family="'Poppins', sans-serif" font-size="14" font-weight="bold" fill="#F8FAFC">Luxury Sedan A6</text>
    <text x="40" y="245" font-family="'Inter', sans-serif" font-size="12" fill="#38BDF8">&#36;85 / day &bull; Automatic</text>
    <rect x="175" y="230" width="60" height="22" rx="6" fill="#3B82F6" />
    <text x="205" y="245" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Book</text>

    <!-- Car 2 -->
    <rect x="270" y="130" width="225" height="140" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" />
    <!-- Stylized SUV Silhouette -->
    <path d="M 295 180 Q 315 150 355 150 L 405 150 Q 435 150 455 180 Z" fill="rgba(79, 70, 229, 0.35)" />
    <circle cx="320" cy="190" r="14" fill="#818CF8" opacity="0.8" />
    <circle cx="430" cy="190" r="14" fill="#818CF8" opacity="0.8" />
    <text x="285" y="225" font-family="'Poppins', sans-serif" font-size="14" font-weight="bold" fill="#F8FAFC">All-Terrain SUV 4x4</text>
    <text x="285" y="245" font-family="'Inter', sans-serif" font-size="12" fill="#818CF8">&#36;120 / day &bull; AWD</text>
    <rect x="420" y="230" width="60" height="22" rx="6" fill="#4F46E5" />
    <text x="450" y="245" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Book</text>
  </g>
</svg>
