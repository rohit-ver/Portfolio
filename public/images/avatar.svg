<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0E7490" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Glow Ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#accentGlow)" stroke-width="3" opacity="0.8" />
  
  <!-- Background -->
  <circle cx="100" cy="100" r="90" fill="url(#avatarBg)" />
  
  <!-- Tech Grid Overlay -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="6,4" />
  
  <!-- Stylized Developer Silhouette -->
  <!-- Shoulders & Torso -->
  <path d="M 45 180 Q 100 135 155 180 Z" fill="url(#accentGlow)" opacity="0.9" />
  
  <!-- Head & Hair -->
  <circle cx="100" cy="95" r="38" fill="#F1F5F9" />
  <!-- Hair style -->
  <path d="M 64 90 Q 95 45 136 78 Q 115 50 80 60 Z" fill="#0F172A" />
  
  <!-- Modern Glasses -->
  <rect x="75" y="86" width="20" height="14" rx="4" fill="none" stroke="#0F172A" stroke-width="3" />
  <rect x="105" y="86" width="20" height="14" rx="4" fill="none" stroke="#0F172A" stroke-width="3" />
  <line x1="95" y1="93" x2="105" y2="93" stroke="#0F172A" stroke-width="3" />
  
  <!-- Smile -->
  <path d="M 90 115 Q 100 124 110 115" stroke="#0F172A" stroke-width="3" stroke-linecap="round" fill="none" />
  
  <!-- Code Symbol Floating Badge -->
  <rect x="125" y="125" width="45" height="26" rx="8" fill="#1E293B" stroke="#06B6D4" stroke-width="2" filter="url(#glow)" />
  <text x="147" y="142" font-family="'Consolas', monospace" font-size="12" font-weight="bold" fill="#38BDF8" text-anchor="middle">&lt;/&gt;</text>
</svg>
